

services:
  db:
    container_name: devgo-prod-db
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env.production.local
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-devgo}
    volumes:
      # PostgreSQL 18 image: the volume is mounted on the parent folder (data lives in /var/lib/postgresql/18)
      - pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devgo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: devgo-prod
    build:
      context: .
      dockerfile: dockerfile
    image: foothubgo-prod:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # Published on the host loopback only: put a reverse proxy (Caddy, Nginx, Traefik) in front for
    # HTTPS and set TRUSTED_IP_HEADER to the header it writes (see README.Docker.md).
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production.local
    # Utilisation de la base de données Neon en production
    # environment:
    #   - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-devgo}

volumes:
  pg18_data:
