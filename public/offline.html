<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Hors ligne · FootHubGo</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      /* Self-contained (served by the service worker without the network): tokens of app/globals.css. */
      :root { --bg: #ffffff; --fg: #09090b; --muted: #71717a; --card: #f4f4f5; --brand: #1f8e5a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --card: #18181b; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.375rem; margin: 20px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px;
        border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Tu es hors ligne</h1>
      <p>Vérifie ta connexion (Wi-Fi ou données mobiles). Tes convocations et tes messages reviennent dès que le réseau est là.</p>
      <a href="/app">Réessayer</a>
    </main>
  </body>
</html>
