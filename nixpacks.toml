[phases.setup]
nixPkgs = ["...", "nodejs_22", "openssl"]

[phases.install]
dependsOn = ["setup"]
cmds = ["bun install --frozen-lockfile"]
cacheDirectories = ["/root/.bun/install/cache"]
paths = ["/app/node_modules/.bin"]

[phases.build]
dependsOn = ["install"]
cmds = ["bun run build"]
cacheDirectories = [".next/cache", "node_modules/.cache"]

[start]
cmd = "bun run start"

[variables]
NODE_ENV = "production"
