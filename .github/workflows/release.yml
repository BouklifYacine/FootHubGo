# CD: when main receives a package.json version that has no release yet, this workflow creates
# the tag vX.Y.Z, the GitHub Release (notes from CHANGELOG.md) and the production Docker image on GHCR.
# Releasing = bump package.json + CHANGELOG.md on dev, then merge dev into main.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to know whether this version is already released

      - name: Read the version and skip if already released
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          # GHCR image names must be lowercase
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract the release notes from CHANGELOG.md
        if: steps.version.outputs.release == 'true'
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]+\]: http/ { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section [$VERSION] in CHANGELOG.md" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.release == 'true'

      - uses: docker/login-action@v3
        if: steps.version.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the production image
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FootHubGo v${{ env.VERSION }}
          body_path: release-notes.md
